{% extends 'base.html' %}

{% block title %}Ruleta{% endblock %}

{% block content %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruleta Aleatoria Interactiva</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='stiloruleta.css') }}">
</head>
<body>
    
    <div class="container">
    <h1>Ruleta de Adrian</h1>
    
    <div class="input-section">
        <label for="inputElements">Añade elementos separados por espacios:</label>
        <textarea id="inputElements" placeholder="Ejemplo: Premio1 Premio2 Premio3"></textarea>
        <button id="addElementsButton">Agregar Elementos</button>
    </div>
    
    <div class="wheel-container">
        <div class="indicator">▼</div>
        <canvas id="wheel" width="500" height="500"></canvas>
        <button id="spinButton" class="spin-button">¡Girar!</button>
    </div>

    <div id="winnerDisplay" class="winner-display"></div>
</div>


    <script src="{{ url_for('static', filename='scriptrule.js') }}"></script>
</body>
</html>
{% endblock %}
